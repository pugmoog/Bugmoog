<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Bugmoog statistics helper</title></head>
<body>
<script>
(() => {
  const API = "https://d3txi12i3pqbxm.cloudfront.net/chet/bugmoog-stats/api";
  const LOCAL = /^(localhost|127\.0\.0\.1|\[?::1\]?)$/.test(location.hostname);
  const STORAGE_KEY = "bugmoog-analytics-id";
  let visitorId = localStorage.getItem(STORAGE_KEY);
  if (!/^[a-f0-9-]{20,80}$/i.test(visitorId || "")) {
    visitorId = crypto.randomUUID();
    localStorage.setItem(STORAGE_KEY, visitorId);
  }

  async function request(path, options = {}) {
    const response = await fetch(`${API}${path}${path.includes("?") ? "&" : "?"}t=${Date.now()}`, {
      cache: "no-store",
      ...options
    });
    if (!response.ok) throw new Error(`Statistics request failed (${response.status}).`);
    return response.json();
  }

  window.addEventListener("message", async event => {
    if (event.source !== parent) return;
    const message = event.data;
    if (message?.type === "bugmoog-stats-event" && !LOCAL) {
      request("/event", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ event: message.event, subject: message.subject, visitorId }),
        keepalive: true
      }).catch(() => {});
    }
    if (message?.type === "bugmoog-stats-popularity-request") {
      try {
        const to = Date.now();
        const from = to - 7 * 86400000;
        let games;
        if (LOCAL) {
          const response = await fetch('./weekly-popularity', { cache: 'no-store' });
          if (!response.ok) throw new Error('Weekly statistics unavailable.');
          games = (await response.json()).games;
        } else {
          const data = await request(`/report/${from}/${to}/hour`);
          games = Object.fromEntries(data.summary
            .filter(row => row.event === 'game_open' && row.subject)
            .map(row => [row.subject, row.opens]));
        }
        parent.postMessage({ type: "bugmoog-stats-popularity", games }, "*");
      } catch {}
    }
  });

  parent.postMessage({ type: "bugmoog-stats-ready" }, "*");
})();
</script>
</body>
</html>
