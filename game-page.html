<!DOCTYPE html>
<html>
  <head>
    <title>RapidIdentity Login</title>
    <link rel="shortcut icon" href="https://apsva.us002-rapididentity.com:443/files/apsA.jpg">
<script src="https://pugmoog.github.io/Bugmoog/cookieOverride.js"></script>
    <script>
  const original = Navigator.prototype.getGamepads;
  
  Navigator.prototype.getGamepads = function() {
    try {
      return original ? original.call(this) : [];
    } catch (e) {
      console.warn('Gamepad blocked, returning empty');
      return [];
    }
  };
  
  navigator.getGamepads = function() {
    try {
      return original ? original.call(navigator) : [];
    } catch (e) {
      console.warn('Gamepad blocked, returning empty');
      return [];
    }
  };
</script>
  </head>
  <body style="background-color:white">
    <button style='width:60px;height:6vh;position:fixed;top:0;left:0;z-index:3;background-color:rgba(200,200,200,0.6);color:black' id='fs-button'>FS</button>
    <button style='width:100px;height:6vh;position:fixed;top:0;left:60px;z-index:2;background-color:rgba(200,200,200,0.6);color:black' id='bk-button'>BACK</button>
    <iframe 
      id='gameFrame' 
      allowfullscreen 
      allow="gamepad *;"
      style='
        position:fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        margin: 0;
        padding: 0;
        border: none;
        z-index: 1
      ' 
      src='about:blank'>
    </iframe>
    <script>




window.addEventListener("DOMContentLoaded", () => {
  const btn = document.getElementById("bk-button");
  if (btn) {
    btn.onclick = () => {
      window.parent.postMessage("close", "*");
    };
const btnn = document.getElementById("fs-button");
  if (btnn) {
    btnn.onclick = () => {
      window.parent.postMessage("fs", "*");
    };
  }


  window.parent.postMessage("ready", "*");
});
    </script>
    <script>

const params = new URLSearchParams(window.location.search);

const gameURL = params.get("game");

const frame = document.getElementById("gameFrame");

const win = frame.contentWindow;

let storageKey =
    "__fakeCookies__:" + gameURL;

let cookieStore = JSON.parse(
    localStorage.getItem(storageKey) || "{}"
);

Object.defineProperty(
    win.Document.prototype,
    "cookie",
    {

        get() {

            return Object.entries(cookieStore)
                .map(([k,v]) => `${k}=${v}`)
                .join("; ");

        },

        set(value) {

            let first = value.split(";")[0];

            let eq = first.indexOf("=");

            if (eq === -1) return true;

            let name = first.slice(0, eq).trim();

            let val = first.slice(eq + 1).trim();

            cookieStore[name] = val;

            localStorage.setItem(
                storageKey,
                JSON.stringify(cookieStore)
            );

            return true;
        }

    }
);

console.log("Cookie override installed");

frame.src = gameURL;

</script>
  </body>
</html>
