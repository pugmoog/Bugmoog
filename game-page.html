<!DOCTYPE html>
<html>
  <head>
    <title>RapidIdentity Login</title>
    <link rel="shortcut icon" href="https://apsva.us002-rapididentity.com:443/files/apsA.jpg">
    <script>
      const original = Navigator.prototype.getGamepads;

      Navigator.prototype.getGamepads = function() {
        try {
          return original ? original.call(this) : [];
        } catch (e) {
          console.warn('Gamepad blocked, returning empty');
          return [];
        }
      };

      navigator.getGamepads = function() {
        try {
          return original ? original.call(navigator) : [];
        } catch (e) {
          console.warn('Gamepad blocked, returning empty');
          return [];
        }
      };
    </script>
  </head>

  <body style="background-color:white">
    <button style="width:60px;height:6vh;position:fixed;top:0;left:0;z-index:3;background-color:rgba(200,200,200,0.6);color:black;display:block;" id="fs-button">FS</button>
    <button style="width:100px;height:6vh;position:fixed;top:0;left:60px;z-index:2;background-color:rgba(200,200,200,0.6);color:black;display:block;" id="bk-button">BACK</button>

    <iframe
      tabindex="0"
      id="gameFrame"
      allow="gamepad *;fullscreen;"
      style="
        position:fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        margin: 0;
        padding: 0;
        border: none;
        z-index: 1
      "
      src="about:blank">
    </iframe>

    <script>
      setInterval(() => {
        document.getElementById("gameFrame").focus();
      }, 20);

      function onFullscreenChange(state) {
        console.log("detected fs change", state);
        if (state === 'entered') {
          document.getElementById("bk-button").style.display = "none";
          document.getElementById("fs-button").style.display = "none";
          console.log("removed buttons");
          document.getElementById("gameFrame").contentWindow.focus();
        } else {
          document.getElementById("bk-button").style.display = "block";
          document.getElementById("fs-button").style.display = "block";
          console.log("readded buttons");
        }
      }

      window.addEventListener("DOMContentLoaded", () => {
        const btn = document.getElementById("bk-button");
        if (btn) {
          btn.onclick = () => {
            window.parent.postMessage("close", "*");
          };
        }

        const btnn = document.getElementById("fs-button");
        if (btnn) {
          btnn.onclick = () => {
            window.parent.postMessage("fs", "*");
          };
        }
      });

      window.addEventListener("message", (e) => {
        console.log("message received", e.data);
        onFullscreenChange(e.data.state);
      });
    </script>

    <script>
      const params = new URLSearchParams(window.location.search);
      const gameURL = params.get("game");
      const frame = document.getElementById("gameFrame");
      const hostStorage = window.localStorage;

      const localStorageKey = "__fakeLocalStorage__:" + gameURL;
      let localStorageData;
      try {
        localStorageData = JSON.parse(hostStorage.getItem(localStorageKey) || "{}");
      } catch {
        localStorageData = {};
      }

      function saveLocalStorage() {
        hostStorage.setItem(localStorageKey, JSON.stringify(localStorageData));
      }

      const localStorageShim = new Proxy({}, {
        get(target, property, receiver) {
          if (property === "length") return Object.keys(localStorageData).length;
          if (property === "getItem") {
            return key => Object.prototype.hasOwnProperty.call(localStorageData, String(key))
              ? localStorageData[String(key)]
              : null;
          }
          if (property === "setItem") {
            return (key, value) => {
              localStorageData[String(key)] = String(value);
              saveLocalStorage();
            };
          }
          if (property === "removeItem") {
            return key => {
              delete localStorageData[String(key)];
              saveLocalStorage();
            };
          }
          if (property === "clear") {
            return () => {
              localStorageData = {};
              saveLocalStorage();
            };
          }
          if (property === "key") {
            return index => Object.keys(localStorageData)[Number(index)] ?? null;
          }
          if (property === Symbol.toStringTag) return "Storage";
          if (typeof property === "string" && Object.prototype.hasOwnProperty.call(localStorageData, property)) {
            return localStorageData[property];
          }
          return Reflect.get(target, property, receiver);
        },

        set(target, property, value) {
          if (typeof property !== "string") return Reflect.set(target, property, value);
          localStorageData[property] = String(value);
          saveLocalStorage();
          return true;
        },

        deleteProperty(target, property) {
          if (typeof property === "string") {
            delete localStorageData[property];
            saveLocalStorage();
          }
          return true;
        },

        ownKeys() {
          return Object.keys(localStorageData);
        },

        getOwnPropertyDescriptor(target, property) {
          if (typeof property === "string" && Object.prototype.hasOwnProperty.call(localStorageData, property)) {
            return { configurable: true, enumerable: true, writable: true, value: localStorageData[property] };
          }
          return Reflect.getOwnPropertyDescriptor(target, property);
        }
      });

      function installLocalStorageShim(targetWindow) {
        Object.defineProperty(targetWindow, "localStorage", {
          configurable: true,
          get: () => localStorageShim
        });
      }

      frame.onload = () => {
        try {
          // Reinstall after navigation so saves made during gameplay use the wrapper's storage.
          installLocalStorageShim(frame.contentWindow);
          frame.contentWindow.Navigator.prototype.getGamepads = () => [];
          frame.contentWindow.navigator.getGamepads = () => [];
          frame.contentWindow.Navigator.getGamepads = () => [];
        } catch (error) {
          console.warn("Could not patch a cross-origin game frame", error);
        }
      };
      const win = frame.contentWindow;

      let cookieStorageKey = "__fakeCookies__:" + gameURL;
      let cookieStore = JSON.parse(hostStorage.getItem(cookieStorageKey) || "{}");

      Object.defineProperty(
        win.Document.prototype,
        "cookie",
        {
          get() {
            return Object.entries(cookieStore)
              .map(([k, v]) => `${k}=${v}`)
              .join("; ");
          },

          set(value) {
            let first = value.split(";")[0];
            let eq = first.indexOf("=");

            if (eq === -1) return true;

            let name = first.slice(0, eq).trim();
            let val = first.slice(eq + 1).trim();

            cookieStore[name] = val;
            hostStorage.setItem(cookieStorageKey, JSON.stringify(cookieStore));

            return true;
          }
        }
      );

      // Install once on the initial about:blank document, then again in onload.
      installLocalStorageShim(win);
      frame.src = gameURL;
    </script>
  </body>
</html>
