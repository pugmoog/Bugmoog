<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BugMoog Stats</title>
  <link rel="stylesheet" href="stats.css?v=5-stats-2" />
</head>
<body>
<h1>BugMoog Stats</h1>
<div id="settings">
  <section class="options-block">
    <h2>Settings</h2>

    <label>Start Time</label>
    <input type="datetime-local" id="start-time">
    <br>
    <label>End Time</label>
    <input type="datetime-local" id="end-time">
    <br><br>

    <label>Precision</label>
    <select id="precision">
      <option>Hours</option>
      <option>Days</option>
      <option>Weeks</option>
    </select>

    <br><br>

    <label>Preset</label>
    <select id="preset">
      <option>Select a preset</option>
      <option>Today</option>
      <option>Last week (hourly)</option>
      <option>Last week (daily)</option>
      <option>Last 30 days</option>
      <option>Last 90 days</option>
    </select>

    <br><br>

    <label>Mode</label>
    <select id="mode">
      <option>Normal</option>
      <option>Average day</option>
      <option>Average week</option>
    </select>
  </section>



  <section class="options-block">
  <h2>Show</h2>

    <div id="show-header">
      <small style="writing-mode: vertical-rl;">Opens</small>
      <small style="writing-mode: vertical-rl;">Devices</small>
    </div>

    <h4>Main</h4>

    <div id="show-bm">
      <input type="checkbox" class="opens">
      <input type="checkbox" class="devices">
      <span>BugMoog Opens</span>
    </div>

    <div id="show-game">
      <input type="checkbox" class="opens">
      <input type="checkbox" class="devices">
      <span>Game Opens</span>
    </div>

    <div id="show-chat">
      <input type="checkbox" class="opens">
      <input type="checkbox" class="devices">
      <span>Chatroom Opens</span>
    </div>

    <h4>
    Individual Games
    <button id="select-all-game-opens">O</button> <!-- O=select all opens; D=select all devices; X=deselect all -->
    <button id="select-all-game-devices">D</button>
    <button id="deselect-all-games">X</button>
    </h4>

    <div class="game-row">
      <input type="checkbox" class="opens">
      <input type="checkbox" class="devices">
      <span>Starship Arena</span>
    </div>

    <div class="game-row">
      <input type="checkbox" class="opens">
      <input type="checkbox" class="devices">
      <span>Pixel Quest</span>
    </div>

    <div class="game-row">
      <input type="checkbox" class="opens">
      <input type="checkbox" class="devices">
      <span>Dungeon Raiders</span>
    </div>

    <div class="game-row">
      <input type="checkbox" class="opens">
      <input type="checkbox" class="devices">
      <span>Racing Rivals</span>
    </div>

    <div class="game-row">
      <input type="checkbox" class="opens">
      <input type="checkbox" class="devices">
      <span>Island Survival</span>
    </div>

    <div class="game-row">
      <input type="checkbox" class="opens">
      <input type="checkbox" class="devices">
      <span>Island Survival 2</span>
    </div>

    <div class="game-row">
      <input type="checkbox" class="opens">
      <input type="checkbox" class="devices">
      <span>Island Survival 3</span>
    </div>
  </section>
</div>

  <h2>Analytics</h2>
  <button id="refresh">Refresh</button>
  <p id="status" role="status">Loading…</p>
  <div class="chart-wrap"><canvas id="chart" aria-label="Selected activity over time" role="img"></canvas></div>
  <p id="note"></p>
  <div id="totals"></div>
  <div id="leaderboards"></div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <script src="stats.js?v=5-stats-2"></script>


</body>
</html>
