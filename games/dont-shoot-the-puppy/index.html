<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Don't Shoot the Puppy</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; }
    ruffle-player { display: block; width: 100%; height: 100%; }
  </style>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
  <script>
    window.addEventListener("load", async () => {
      try {
        const player = window.RufflePlayer.newest().createPlayer();
        document.body.appendChild(player);
        await player.load("dont-shoot-the-puppy.swf");
      } catch (error) {
        console.error(error);
        const message = document.createElement("p");
        message.style.color = "white";
        message.textContent = "Unable to load the game. Check your internet connection and open this page through your local HTTP server.";
        document.body.appendChild(message);
      }
    });
  </script>
</body>
</html>
