<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pokémon Emerald</title><style>html,body{margin:0;background:#111;color:#eee;font:14px system-ui}#game{width:100%;height:calc(100dvh - 104px);min-height:320px}footer{padding:8px 14px}a{color:#aad1ff}button{font:inherit;padding:5px 10px}</style><div id="game"></div><footer>Arrows: move · Z: A · X: B · Enter: Start · V: Select · Q/E: L/R<br>Touch controls appear on touch devices. Use the emulator toolbar to export/import save files and states. Save inside the game first. <button id="flush">Flush save now</button> <span id="status"></span></footer><script>
