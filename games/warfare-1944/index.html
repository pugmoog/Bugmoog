<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warfare 1944</title>
  <style>
    html, body, #container { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111; }
    ruffle-player { width: 100%; height: 100%; }
  </style>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
  <div id="container"></div>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.addEventListener("load", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      document.querySelector("#container").appendChild(player);
      player.load("warfare-1944.swf");
    });
  </script>
</body>
</html>
