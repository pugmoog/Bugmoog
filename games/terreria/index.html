<!DOCTYPE html>
<html>
<head>
<script src="../../saving/save-runtime.js?v=5.4-save1"></script>

    <title>File Merger</title>
</head>
<body>
    <h1>Loading and combining parts...</h1>
    <script>
        const parts = ['1.txt', '2.txt']; // Add all your parts
        
        Promise.all(
            parts.map(part => fetch(part).then(r => r.text()))
        ).then(contents => {
            const combined = contents.join('');
            document.open();
            document.write(combined);
            document.close();
        }).catch(err => {
            document.write('Error: ' + err.message);
        });
    </script>
</body>
</html>
