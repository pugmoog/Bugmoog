<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Granny 3 — FinalBuild jsDelivr</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#231f20;color:#eee;font:16px system-ui}#unity-canvas{width:100%;height:100%;display:block}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#231f20;z-index:2}.panel{width:min(440px,85vw)}h1{font-size:22px}progress{width:100%;height:20px;accent-color:#ddd}#detail{color:#bbb;font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}button{padding:8px 16px}#loading[hidden],[hidden]{display:none!important}
</style></head><body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="loading" role="status" aria-live="polite"><div class="panel"><h1 id="status">Loading Granny 3…</h1><progress id="progress"></progress><p id="detail">Connecting to the game host…</p><button id="retry" hidden>Retry</button></div></div>
<script>

const sourceBase = "https://cdn.jsdelivr.net/gh/larpinguser/granny3-webport@main/FinalBuild/";
const baseUrl = sourceBase + "Build/";
const loaderUrl = baseUrl + "FinalBuild.loader.js";
const overlay = document.getElementById('loading');
const statusText = document.getElementById('status');
const detail = document.getElementById('detail');
const bar = document.getElementById('progress');
const retry = document.getElementById('retry');
retry.onclick = () => location.reload();
let failed = false, completed = 0, received = 0, lastActivity = Date.now();
const active = new Set(), blobUrls = [], controller = new AbortController();
function fail(error) {
 if(failed) return;
 failed = true; controller.abort(); clearInterval(watchdog);
 overlay.hidden = false; statusText.textContent = 'Unable to load Granny 3';
 bar.hidden = true; retry.hidden = false;
 detail.textContent = String(error?.message || error) + '\n\nThe game files are hosted online. Check your connection. If this is a file:// page, try your local HTTP server; the host may also block cross-origin requests.';
 console.error(error);
}
const watchdog = setInterval(() => {
 if(Date.now()-lastActivity > 90000) fail(new Error('Loading stalled: no progress for 90 seconds.'));
}, 5000);
function showDownload() {
 if(failed) return;
 lastActivity = Date.now();
 statusText.textContent = 'Downloading game files'; bar.max = 22; bar.value = completed;
 detail.textContent = `${completed} of 22 parts complete · ${(received/1048576).toFixed(1)} MB received\n${[...active].join('\n')}`;
}
async function fetchAndMerge(filename, count, pad) {
 const parts=[];
 for(let i=1;i<=count;i++) {
  const name = `${filename}.part${pad ? String(i).padStart(2,'0') : i}`;
  active.add(name); showDownload();
  const response=await fetch(baseUrl+name,{signal:controller.signal});
  if(!response.ok) throw new Error(`${name}: HTTP ${response.status} ${response.statusText}`);
  if(response.body) {
   const reader=response.body.getReader(), chunks=[];
   while(true) { const {done,value}=await reader.read(); if(done) break; chunks.push(value); received+=value.byteLength; showDownload(); }
   parts.push(new Blob(chunks));
  } else { const data=await response.arrayBuffer(); received+=data.byteLength; parts.push(data); }
  active.delete(name); completed++; showDownload();
 }
 const url=URL.createObjectURL(new Blob(parts,{type:'application/octet-stream'})); blobUrls.push(url); return url;
}
function loadScript(url) {
 return new Promise((resolve,reject)=>{
  const script=document.createElement('script'); script.src=url;
  script.onload=resolve; script.onerror=()=>reject(new Error('Unable to download the Unity loader: '+url)); document.head.appendChild(script);
 });
}
window.addEventListener('error',event=>{if(event.message) fail(new Error(event.message));});
window.addEventListener('unhandledrejection',event=>{fail(event.reason);});
(async()=>{
 try {
  await loadScript(loaderUrl);
  if(typeof createUnityInstance!=='function') throw new Error('The Unity loader did not initialize.');
  const [wasmUrl,dataUrl]=await Promise.all([fetchAndMerge('FinalBuild.wasm',2,false),fetchAndMerge('FinalBuild.data',20,true)]);
  if(failed)return;
  statusText.textContent='Starting game'; bar.max=100; bar.value=0; detail.textContent='Initializing Unity…';lastActivity=Date.now();
  window.unityInstance=await createUnityInstance(document.getElementById('unity-canvas'),{
   dataUrl,codeUrl:wasmUrl,frameworkUrl:baseUrl+'FinalBuild.framework.js',
   streamingAssetsUrl:new URL('../StreamingAssets',baseUrl).href,
   companyName:'DVloper',productName:'Granny 3',productVersion:'1.2',
   showBanner:(message,type)=>{if(type==='error')fail(new Error(message));else console.warn(message);}
  },progress=>{if(failed)return;lastActivity=Date.now();bar.value=progress*100;detail.textContent=`Initializing Unity: ${Math.round(progress*100)}%`;});
  if(!failed){clearInterval(watchdog);overlay.hidden=true;document.getElementById('unity-canvas').focus();}
 }catch(error){fail(error);}
})();
window.addEventListener('pagehide',()=>{controller.abort();blobUrls.forEach(url=>URL.revokeObjectURL(url));});

</script></body></html>
